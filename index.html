<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://api.github.com; img-src 'self' data: blob:; base-uri 'none'; form-action 'none'">
<title>改稿机</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* 木の机に原稿を広げた画面: 本文は明朝で広く、操作は細いゴシックで控えめに。色は胡桃材と生成りの紙から。
   明るい・暗いは端末の設定に引っぱられず、画面の右上で自分で切り替える（data-desk）。 */
:root{
  --paper:#f3ede4; --sheet:#fffcf7; --ink:#2a211b; --muted:#7b6b5e; --rule:#e5dacd; --rule-strong:#cdbcaa;
  --accent:#6e4527; --accent-ink:#fffaf3; --accent-soft:rgba(110,69,39,.10);
  --ins:rgba(104,128,52,.18); --ins-line:#6b8434; --del:#a5432f; --del-bg:rgba(165,67,47,.10);
  --tag:rgba(226,177,64,.36); --tag-soft:rgba(226,177,64,.15); --tag-line:#bf8a1f; --blank:#3f5f8a; --blank-bg:rgba(63,95,138,.12);
  --sel:rgba(110,69,39,.12); --shadow:0 10px 30px rgba(42,28,18,.16); --scrim:rgba(30,20,12,.40);
  --f-text:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
  --f-ui:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  --r:10px; color-scheme:light;
  --fs-text:16px; --lh-text:1.95; /* 本文の文字の大きさと行間（設定タブで端末ごとに変える） */
}
:root[data-desk="dark"]{
  --paper:#1f1813; --sheet:#2a211a; --ink:#ede2d5; --muted:#ab9888; --rule:#3d3027; --rule-strong:#57463a;
  --accent:#d9a877; --accent-ink:#24190f; --accent-soft:rgba(217,168,119,.14);
  --ins:rgba(160,190,100,.20); --ins-line:#a9c46a; --del:#e8907a; --del-bg:rgba(232,144,122,.13);
  --tag:rgba(230,185,80,.27); --tag-soft:rgba(230,185,80,.11); --tag-line:#e0b453; --blank:#9fbbe3; --blank-bg:rgba(159,187,227,.15);
  --sel:rgba(217,168,119,.15); --shadow:0 10px 30px rgba(0,0,0,.5); --scrim:rgba(8,5,3,.55); color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--paper)}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.6;padding-inline:16px;padding-block:0 120px}
.wrap{max-width:1180px;margin:0 auto}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* claude.ai は画面の上に余白（safe-area-inset-top）を足す。見出しをその余白まで伸ばし、上のすき間に本文がすけて見えないようにする */
header.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule);margin:calc(-1 * env(safe-area-inset-top,0px)) -16px 0;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 0}
.top-in{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.brand-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--f-text);font-size:20px;font-weight:600;letter-spacing:.12em}
.status{font-size:12px;color:var(--muted);margin-left:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{border:1px solid var(--rule-strong);background:var(--sheet);border-radius:99px;padding:2px 10px;font-size:12px;color:var(--muted)}
.today{font-size:12px;color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:0 8px;font-variant-numeric:tabular-nums;white-space:nowrap}
.work-row{display:flex;gap:8px;align-items:center}
.shelfbtn{flex:1 1 auto;min-width:0;max-width:560px;text-align:left;padding:6px 12px;border:1px solid var(--rule-strong);border-radius:8px;background:var(--sheet);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shelfbtn .crumb{color:var(--muted)}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tab{border:0;background:none;padding:8px 14px;border-bottom:2px solid transparent;color:var(--muted);white-space:nowrap;font-weight:500}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.badge{display:inline-block;min-width:1.6em;padding:0 .4em;margin-left:4px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:11px;text-align:center;font-variant-numeric:tabular-nums}

.btn{border:1px solid var(--rule-strong);background:var(--sheet);border-radius:8px;padding:6px 12px;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.danger{color:var(--del);border-color:var(--del)}
.btn.small{padding:2px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default}

main{padding-top:16px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--rule-strong);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--sheet);padding:5px 12px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:500}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.hint{font-size:12px;color:var(--muted)}
.banner{border:1px dashed var(--tag-line);background:var(--tag-soft);padding:8px 12px;border-radius:8px;margin-bottom:12px;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.banner span{flex:1 1 220px;min-width:0}

/* 本文 */
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:8px 0}
.colhead{display:grid;grid-template-columns:1fr 1fr;font-size:12px;color:var(--muted);padding:2px 0 6px;border-bottom:1px solid var(--rule)}
.colhead div{padding:0 16px}
.row{display:grid;grid-template-columns:1fr 1fr}
.cell{display:flex;gap:10px;padding:3px 16px;min-width:0}
.cell.o{border-right:1px solid var(--rule)}
.ln{flex:0 0 2.6em;text-align:right;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;padding-top:.45em;user-select:none}
.tx{flex:1;min-width:0;font-family:var(--f-text);font-size:var(--fs-text);line-height:var(--lh-text);white-space:pre-wrap;overflow-wrap:anywhere}
.cell.c{cursor:pointer}
.cell.c.blankline{cursor:default}
.cell.c.sel{background:var(--sel)}
.cell.c.has-mark{box-shadow:inset 3px 0 0 var(--tag-line)}
.cell.c.has-mark .tx{background:var(--tag-soft)}
.row.empty .tx{min-height:1em}
.d{background:var(--del-bg);color:var(--del);text-decoration:line-through;text-decoration-thickness:1px}
.dx{font-size:.8em;color:var(--del);text-decoration:line-through;text-decoration-thickness:1px;opacity:.75;user-select:none;-webkit-user-select:none;margin:0 1px}
.a{background:var(--ins);border-bottom:1.5px solid var(--ins-line)}
.row.ins .cell.c .tx{background:var(--ins)}
.row.del .cell.o .tx{background:var(--del-bg)}
mark.m{background:var(--tag);color:inherit;border-radius:2px;padding:0 1px;box-shadow:0 1.5px 0 var(--tag-line)}
/* 行全体の印を開く札（行の頭の番号の下） */
.chip-m{display:block;margin-top:2px;font-family:var(--f-ui);font-size:10px;line-height:1.5;padding:0 3px;border-radius:4px;background:var(--tag);color:var(--ink);border:1px solid var(--tag-line);cursor:pointer;text-align:center;white-space:nowrap}
/* 印の窓を開いている間の、いま書いている印の場所 */
.cell.c.focus{background:var(--tag-soft);box-shadow:inset 4px 0 0 var(--accent),0 0 0 2px var(--accent)}
mark.m.focus,.chip-b.focus,.chip-m.focus{outline:2px solid var(--accent);outline-offset:1px}
.ln .chip-m + .chip-m{margin-top:3px}
.chip-b{display:inline-block;font-family:var(--f-ui);font-size:13px;line-height:1.5;padding:0 7px;margin:0 2px;border-radius:5px;background:var(--blank-bg);color:var(--blank);border:1px solid var(--blank);cursor:pointer;white-space:nowrap;user-select:none;-webkit-user-select:none}
.chip-b.lost{border-style:dashed}
.insrow .cell.c .tx{font-family:var(--f-ui);font-size:13px;color:var(--blank)}
.insrow .cell.c{cursor:default}
.mode-work .row,.mode-work .colhead,.mode-orig .row,.mode-orig .colhead{grid-template-columns:1fr}
.mode-work .cell.o,.mode-orig .cell.c,.mode-work .colhead .ho,.mode-orig .colhead .hc{display:none}
.mode-work .row.del .cell.o{display:flex;opacity:.7}
.mode-work .row.del .cell.o .tx{font-size:14px}
.mode-work .cell.o{border-right:0}
.mode-orig .row.ins,.mode-orig .insrow{display:none}
/* 変更の色を隠す（右下の目のボタン）: 増えた・消えたの色と取り消し線を消し、印だけを残す */
.sheet.nodiff .a{background:none;border-bottom:0}
.sheet.nodiff .d{background:none;color:inherit;text-decoration:none}
.sheet.nodiff .dx{display:none}
.sheet.nodiff .row.ins .cell.c .tx,.sheet.nodiff .row.del .cell.o .tx{background:none}
.sheet.mode-work.nodiff .row.del{display:none}
.legend.nodiff .ld{display:none}
/* その場で書き換える行（書くモード・PCのダブルクリック） */
.cell.c.editing{cursor:text}
textarea.inl{display:block;width:100%;min-height:0;margin:0;padding:0;border:0;border-radius:0;outline:none;resize:none;overflow:hidden;background:transparent;color:inherit;font-family:var(--f-text);font-size:var(--fs-text);line-height:var(--lh-text);white-space:pre-wrap;overflow-wrap:anywhere}
.sheet.writing .cell.c{cursor:text}
.editor{display:flex;flex-direction:column;gap:10px}
.editor textarea{font-family:var(--f-text);font-size:var(--fs-text);line-height:var(--lh-text);min-height:60vh;padding:12px 14px;border:1px solid var(--rule-strong);border-radius:var(--r);background:var(--sheet);width:100%;resize:vertical}
.emptystate{padding:48px 24px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.emptystate h2{font-family:var(--f-text);font-weight:600;font-size:22px;margin:0;text-wrap:balance}
.emptystate p{margin:0;color:var(--muted);max-width:34em}

/* 操作の帯 */
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sheet);border-top:1px solid var(--rule-strong);box-shadow:var(--shadow);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.actionbar .in{max-width:1180px;margin:0 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.actionbar .what{flex:1 1 100%;min-width:0;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ほめる札 */
.praise{position:fixed;right:16px;left:16px;margin-inline:auto;max-width:460px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:35;background:var(--sheet);border:1px solid var(--accent);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.praise.up{bottom:calc(118px + env(safe-area-inset-bottom,0px))}
.praise .pt{flex:1;min-width:0;font-family:var(--f-text);font-size:15px;line-height:1.8}
.praise .pl{display:block;font-family:var(--f-ui);font-size:11px;color:var(--accent);letter-spacing:.08em;margin-bottom:2px}

/* 一覧 */
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px}
.card h3{margin:0 0 10px;font-size:14px;font-weight:700}
.mlist{display:flex;flex-direction:column;gap:8px}
.mitem{border:1px solid var(--rule);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--paper)}
.mitem.done{opacity:.75}
.mitem.touched{border-color:var(--ins-line)}
.mhead{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.kind{font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--tag);color:var(--ink)}
.kind.blank,.kind.insert{background:var(--blank-bg);color:var(--blank)}
.flag{font-size:11px;padding:0 7px;border-radius:99px;border:1px solid var(--ins-line);color:var(--ins-line)}
.where{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.quote{font-family:var(--f-text);font-size:14px;overflow-wrap:anywhere}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tags span{font-size:11px;border:1px solid var(--rule-strong);border-radius:99px;padding:0 7px;color:var(--muted)}
.mfoot{display:flex;gap:6px;flex-wrap:wrap}
.lost{font-size:12px;color:var(--del)}
.progress{height:6px;border-radius:99px;background:var(--rule);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px}
pre.out{white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--f-ui);font-size:12.5px;line-height:1.7;background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:12px;max-height:60vh;overflow:auto;margin:0}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
input.rqn{width:5.5em;border:1px solid var(--rule-strong);border-radius:8px;padding:4px 8px;background:var(--sheet);font-variant-numeric:tabular-nums}
textarea,input[type=text],select.inp{width:100%;border:1px solid var(--rule-strong);border-radius:8px;padding:8px 10px;background:var(--sheet)}
textarea.body{font-family:var(--f-text);font-size:var(--fs-text);line-height:var(--lh-text);min-height:220px}
/* 設定 */
.setrow{display:grid;grid-template-columns:6.5em auto minmax(0,1fr) auto 3.6em;gap:8px;align-items:center;font-size:13px}
.setrow input[type=range]{width:100%;accent-color:var(--accent)}
.setrow output{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
.pv{font-family:var(--f-text);font-size:var(--fs-text);line-height:var(--lh-text);white-space:pre-wrap;background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:10px 14px}
.switch{display:flex;gap:10px;align-items:center;font-size:13px;cursor:pointer}
.switch input{width:18px;height:18px;accent-color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:12px}
.vlist{display:flex;flex-direction:column}
.vitem{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--rule)}
.vitem .meta{flex:1 1 200px;min-width:0;font-size:13px;font-variant-numeric:tabular-nums}
.vitem .meta b{font-weight:700;margin-right:6px}
.cur-tag{font-size:11px;color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:0 7px;margin-left:6px}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stat{display:flex;gap:18px;flex-wrap:wrap;font-size:13px}
.stat b{font-size:18px;font-variant-numeric:tabular-nums;margin-right:2px}
.ba{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:13px;margin:0}
.ba dt{color:var(--muted)}
.ba dd{margin:0;font-family:var(--f-text);overflow-wrap:anywhere;white-space:pre-wrap}
.week{display:flex;gap:4px;align-items:flex-end}
.week div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.week i{display:block;width:22px;border-radius:3px;background:var(--accent);min-height:2px}
.week i.zero{background:var(--rule)}
.saybox{font-family:var(--f-text);font-size:14px;line-height:1.8;border-left:3px solid var(--accent);padding:4px 10px;white-space:pre-wrap}

/* 入力の窓 */
/* 窓の下敷き: キーボードが出ているときは見えている範囲（--vvt・--vvh）に合わせる */
.scrim{position:fixed;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100%);background:var(--scrim);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.dialog{background:var(--sheet);border-radius:14px;box-shadow:var(--shadow);width:min(640px,100%);max-height:calc(100% - 32px);overflow:auto;padding:18px 20px 0;display:flex;flex-direction:column;gap:14px}
.dialog h2{margin:0;font-size:16px}
/* 窓の中身は縮めずに、窓のほうをスクロールさせる（引用の枠がつぶれて読めなくならないように） */
.dialog > *{flex-shrink:0}
.dq{font-family:var(--f-text);font-size:15px;background:var(--paper);border-left:3px solid var(--tag-line);padding:6px 10px;overflow-wrap:anywhere;max-height:8.5em;overflow:auto}
.dq .caret{color:var(--blank);font-family:var(--f-ui);font-weight:700}
.group{display:flex;flex-direction:column;gap:6px}
.group .gl{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--rule-strong);background:var(--sheet);border-radius:99px;padding:3px 11px;font-size:12.5px}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chips button .ord{font-size:10px;margin-left:4px;opacity:.85}
.dfoot{position:sticky;bottom:0;margin:0 -20px;padding:12px 20px calc(14px + env(safe-area-inset-bottom,0px));background:var(--sheet);border-top:1px solid var(--rule);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.dfoot .left{margin-right:auto}
.checks{display:flex;flex-direction:column;gap:6px;font-size:13px}
.checks label{display:flex;gap:8px;align-items:flex-start}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:8px;font-size:13px;max-width:calc(100% - 32px)}
.fab{position:fixed;right:16px;bottom:calc(var(--barh,0px) + 18px + env(safe-area-inset-bottom,0px));z-index:32;display:flex;flex-direction:column;gap:10px}
.fab button{width:48px;height:48px;border-radius:50%;border:1px solid var(--rule-strong);background:var(--sheet);color:var(--accent);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;padding:0}
.fab button.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.fab button:disabled{opacity:.35;box-shadow:none;cursor:default}
.fab button[aria-pressed="true"]{background:linear-gradient(var(--accent-soft),var(--accent-soft)),var(--sheet);border:2px solid var(--accent)}
.fab svg{width:22px;height:22px}
body.sheet-open .fab{display:none}
body.has-fab .praise{right:80px}
body.has-fab .toast{bottom:calc(var(--barh,0px) + 260px + env(safe-area-inset-bottom,0px))}
/* 印の中身の吹き出し（PCはカーソルを合わせたとき、スマホは1回目のタップ） */
.peek{position:fixed;z-index:36;max-width:min(340px,calc(100vw - 24px));background:var(--sheet);border:1px solid var(--rule-strong);border-radius:10px;box-shadow:var(--shadow);padding:10px 12px;font-size:13px;line-height:1.6;display:flex;flex-direction:column;gap:6px}
.peek.hoveronly{pointer-events:none}
.peek .pk-c{font-family:var(--f-text);font-size:14px;overflow-wrap:anywhere}
.peek .pk-b{display:flex;gap:6px;justify-content:flex-end}
/* 印の中身を本文の下に出す行 */
.noterow .cell.c{cursor:default;padding-top:0}
.noterow .tx{font-family:var(--f-ui);font-size:12px;line-height:1.6;color:var(--muted)}
.noterow .nt{display:block;cursor:pointer}
.noterow .nt b{color:var(--tag-line);font-weight:700;margin-right:4px}
.mode-orig .noterow{display:none}
.toastbtn{margin-left:10px;border:1px solid var(--paper);background:none;color:var(--paper);border-radius:6px;padding:1px 10px;font-size:13px;font-weight:500}

/* 棚（作業とフォルダ） */
.tree{display:flex;flex-direction:column;gap:2px}
.tree details{border-left:1px solid var(--rule);margin-left:6px;padding-left:10px}

@media (max-width:760px){

  .scrim.half{background:transparent;pointer-events:none}

}

// ---------- 端末ごとの覚え書き（壊れても動くように） ----------
// GitHub版: 端末には何も残さないので、覚え書き（表示の設定や書きかけ）はページを開いている間だけ持つ
const lsMem = new Map();
const ls = {

function applyDesk(){ document.documentElement.setAttribute("data-desk", desk); }
applyDesk();
// 本文の文字の大きさと行間（端末ごと）
const TXT_DEF = {fs:16, lh:1.95};
const clampN = (v, lo, hi, d) => Number.isFinite(v) ? Math.min(hi, Math.max(lo, v)) : d;
let txt = (() => { const v = ls.get("kaikou.text", TXT_DEF) || TXT_DEF; return {fs: clampN(+v.fs, 13, 24, TXT_DEF.fs), lh: clampN(+v.lh, 1.4, 2.6, TXT_DEF.lh)}; })();
function applyText(){ const r = document.documentElement.style; r.setProperty("--fs-text", txt.fs + "px"); r.setProperty("--lh-text", String(txt.lh)); }
applyText();

// ---------- 状態 ----------
let store = null;          // 保存先（claude.aiの保存 または この端末）
let works = [];            // 一覧 {id,title,section,folder,updatedAt}
let folders = [];          // フォルダの道筋 "枝頭の春/3章"

// ---------- 合言葉による暗号化（GitHub版と初回設定で共通） ----------
// 合言葉から PBKDF2（SHA-256、60万回）で鍵を作り、gzip で縮めてから AES-GCM で暗号化する。
// 置くファイルは {v, kdf, iter, z, salt, iv, ct} の JSON で、中身は合言葉がないと読めない。
const KDF_ITER = 600000;
const te = new TextEncoder(), td = new TextDecoder();
const b64 = u8 => { let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const pipeBytes = async (u8, t) => new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(t)).arrayBuffer());
async function deriveKey(pass, salt, iter){
  const base = await crypto.subtle.importKey("raw", te.encode(pass.normalize("NFC")), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", hash:"SHA-256", salt, iterations:iter}, base, {name:"AES-GCM", length:256}, false, ["encrypt", "decrypt"]);
}
// 新しい塩で鍵を作る（初回設定で使う）
async function newKey(pass){ const salt = crypto.getRandomValues(new Uint8Array(16)); return {key: await deriveKey(pass, salt, KDF_ITER), salt, iter: KDF_ITER}; }
async function seal(k, text){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const pt = await pipeBytes(te.encode(text), new CompressionStream("gzip"));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM", iv}, k.key, pt));
  return JSON.stringify({v:1, kdf:"PBKDF2-SHA256", iter:k.iter, z:"gzip", salt:b64(k.salt), iv:b64(iv), ct:b64(ct)});
}
// 合言葉が違うときは {code:"badpass"} を投げる。解けたら、同じ鍵で暗号化し直せるように鍵も返す
async function unseal(pass, boxText){
  let box; try { box = JSON.parse(boxText); } catch { throw {code:"broken"}; }
  const salt = unb64(box.salt), key = await deriveKey(pass, salt, box.iter);
  let pt;
  try { pt = new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(box.iv)}, key, unb64(box.ct))); }
  catch { throw {code:"badpass"}; }
  if (box.z === "gzip") pt = await pipeBytes(pt, new DecompressionStream("gzip"));
  return {text: td.decode(pt), k: {key, salt, iter: box.iter}};
}
// GitHub の API。cache は使わない（古い中身を読んで上書きしないように）
const GH_API = "https://api.github.com";
const GH_WHO = {name:"desk", email:"desk@example.invalid"};   // 記録に残る名前（あなたのメールアドレスを残さない）
function ghApi(token, path, opt = {}){
  return fetch(GH_API + path, {...opt, cache:"no-store", headers:{"Accept":"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28", "Authorization":"Bearer " + token, ...(opt.headers || {})}});
}
// git の blob の sha（上書きのときに「読んだときの中身」を示すのに使う）
async function blobSha(u8){
  const head = te.encode(`blob ${u8.length}\0`), all = new Uint8Array(head.length + u8.length);
  all.set(head); all.set(u8, head.length);
  return [...new Uint8Array(await crypto.subtle.digest("SHA-1", all))].map(x => x.toString(16).padStart(2, "0")).join("");
}

// ---------- GitHub版: 合言葉で開き、暗号化して非公開のリポジトリへ保存する ----------
// key.enc（このページと同じ場所）に GitHub の鍵と保存先、data.enc（非公開のリポジトリ）に全データが入っている。
// 端末には何も残さない: データはこのページの中だけに持ち、閉じれば消える。
const GH_MIN_GAP = 4000;            // 続けて来た保存は、4秒の間をあけて1回にまとめて送る
const GH_IDLE = 30 * 60 * 1000;     // 30分さわらなければ閉じて鍵をかける
let gh = null;                      // {token, owner, repo, path, sha, k, data, conflict}
let ghRev = 0, ghSavedRev = 0;      // 変えた回数と、GitHubに届いた回数（違えば未保存がある）
const ghUnsaved = () => gh && ghRev !== ghSavedRev;
const GH_CONFLICT = {code:"conflict", message:"GitHub上のデータが、このページを開いた後に別の場所で変わりました。上書きしないよう保存を止めています。ページを読み直してください"};
const LOCK_ERR = {badpass:"合言葉が違います", nokey:"鍵のファイル（key.enc）が見つかりません。初回設定がまだです", token:"GitHubの鍵が使えません（期限切れか取り消し）", broken:"保存されたファイルが壊れています", nodata:"データのファイル（data.enc）が見つかりません"};

async function ghUnlock(pass){
  const kr = await fetch("./key.enc", {cache:"no-store"});
  if (!kr.ok) throw {code:"nokey"};
  const conf = JSON.parse((await unseal(pass, await kr.text())).text);
  const dr = await ghApi(conf.token, `/repos/${conf.owner}/${conf.repo}/contents/${conf.path}`, {headers:{Accept:"application/vnd.github.raw"}});
  if (dr.status === 401) throw {code:"token"};
  if (dr.status === 404) throw {code:"nodata"};
  if (!dr.ok) throw {message:`GitHubから読めませんでした（${dr.status}）`};
  const raw = new Uint8Array(await dr.arrayBuffer());
  const x = await unseal(pass, td.decode(raw)), body = JSON.parse(x.text);
  const data = body.data || {};
  for (const f of ["works", "versions", "requests", "undo", "meta"]) data[f] ||= {};
  gh = {token:conf.token, owner:conf.owner, repo:conf.repo, path:conf.path, sha:await blobSha(raw), k:x.k, data, conflict:false};
}

async function ghPush(){
  if (gh.conflict) throw GH_CONFLICT;
  const rev = ghRev;
  const sealed = await seal(gh.k, JSON.stringify({format:"kaikou-gh-1", data:gh.data}));
  let r;
  try {
    r = await ghApi(gh.token, `/repos/${gh.owner}/${gh.repo}/contents/${gh.path}`, {method:"PUT", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:"update", content:b64(te.encode(sealed)), sha:gh.sha, committer:GH_WHO, author:GH_WHO})});
  } catch { throw {code:"unavailable"}; }
  if (r.status === 409 || r.status === 422) { gh.conflict = true; throw GH_CONFLICT; }
  if (r.status === 401) throw {message:LOCK_ERR.token};
  if (!r.ok) throw r.status >= 500 || r.status === 403 || r.status === 429 ? {code:"unavailable"} : {message:`GitHubに保存できませんでした（${r.status}）`};
  gh.sha = (await r.json()).content.sha;
  ghSavedRev = rev;
}
// 保存を頼まれたら待ち行列に入れ、まとめて1回送る。送れた時点で、それまでに頼んだ人すべてに「済んだ」と返す
let ghWaiters = [], ghRunning = false, ghLastAt = 0, ghRetry = null;
function ghSave(){ return new Promise((ok, no) => { ghWaiters.push({ok, no}); if (!ghRunning) ghLoop(); }); }
async function ghLoop(){
  ghRunning = true;
  while (ghWaiters.length) {
    await new Promise(r => setTimeout(r, Math.max(300, ghLastAt + GH_MIN_GAP - Date.now())));
    const batch = ghWaiters.splice(0);
    try { await ghPush(); batch.forEach(w => w.ok()); }
    catch (e) { batch.forEach(w => w.no(e)); }
    ghLastAt = Date.now();
  }
  ghRunning = false;
  // つながらずに送れなかった変更が残っていれば、あとでもう一度送る
  clearTimeout(ghRetry);
  if (ghUnsaved() && !gh.conflict) ghRetry = setTimeout(() => ghSave().then(() => setStatus(`保存しました（${store.label}）`), () => {}), 8000);
}

// 端末保存と同じ形のデータを、ページの中に持つ。変えたら GitHub へ送り、届いてから返す
function ghStore(){
  const d = gh.data, c = o => o == null ? null : JSON.parse(JSON.stringify(o));
  const ch = () => { ghRev++; return ghSave(); };
  return {
    label: "GitHubに暗号化して保存",
    async listWorks(){ return Object.values(d.works).map(w => ({id:w.id,title:w.title,section:w.section,folder:w.folder||"",updatedAt:w.updatedAt,open:(w.marks||[]).filter(m=>m.status==="open").length})).sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt)); },
    async getWork(id){ return c(d.works[id]); },
    async putWork(w){ d.works[w.id] = c(w); await ch(); },
    async deleteWork(id){ delete d.works[id]; delete d.versions[id]; delete d.requests[id]; delete d.undo[id]; await ch(); },
    async addVersion(id, v){ d.versions[id] = (d.versions[id] || []).filter(x => x.n !== v.n).concat([c(v)]); await ch(); },
    async deleteVersion(id, n){ d.versions[id] = (d.versions[id] || []).filter(v => v.n !== n); await ch(); },
    async listVersions(id){ return c(d.versions[id] || []).sort((a,b)=>a.n-b.n); },
    async addRequest(id, r){ d.requests[id] = (d.requests[id] || []).filter(x => x.id !== r.id).concat([c(r)]); await ch(); },
    async listRequests(id){ return c(d.requests[id] || []).sort((a,b)=>a.at.localeCompare(b.at)); },
    async putUndo(id, key, u){ (d.undo[id] ||= {})[key] = c(u); await ch(); },
    async getUndo(id, key){ return c((d.undo[id] || {})[key]); },
    async deleteUndo(id, key){ if (d.undo[id]) delete d.undo[id][key]; await ch(); },
    async getMeta(k){ return c(d.meta[k]); },
    async putMeta(k, v){ d.meta[k] = c(v); await ch(); },
  };
}

// 合言葉の画面。開けたら画面ごと取り除く（合言葉はページに残さない）
function ghWaitUnlock(){
  return new Promise(done => {
    const inp = $("#lockPass"), msg = $("#lockMsg"), btn = $("#lockGo");
    if (!(window.crypto && crypto.subtle && window.CompressionStream)) { msg.textContent = "このブラウザでは開けません。新しいChrome・Edge・Safari・Firefoxで開いてください"; btn.disabled = inp.disabled = true; return; }
    inp.focus();
    const go = async () => {
      if (!inp.value) return;
      btn.disabled = inp.disabled = true; msg.textContent = "開いています…";
      try { await ghUnlock(inp.value); inp.value = ""; $("#lock").remove(); done(); }
      catch (e) { msg.textContent = LOCK_ERR[e && e.code] || `開けませんでした（${(e && e.message) || e}）`; btn.disabled = inp.disabled = false; inp.value = ""; inp.focus(); }
    };
    btn.onclick = go;
    inp.onkeydown = e => { if (e.key === "Enter" && !e.isComposing) go(); };
  });
}
// 閉じて鍵をかける: 未保存を送ってから、ページを読み直してデータを消す
async function ghClose(force){
  if (!gh) return;
  setStatus("保存して閉じています…");
  try { await flush(); if (ghUnsaved()) await ghSave(); } catch {}
  if (ghUnsaved() && !force) { setStatus("保存できていない変更があるため閉じませんでした。つながりを確かめてから、もう一度押してください"); return false; }
  gh = null; location.replace(location.pathname);
  return true;
}
let ghLastTouch = Date.now();
["pointerdown", "keydown", "wheel", "touchstart"].forEach(t => window.addEventListener(t, () => { ghLastTouch = Date.now(); }, {passive:true, capture:true}));
setInterval(() => { if (gh && Date.now() - ghLastTouch > GH_IDLE) ghClose(false); }, 60 * 1000);

// ---------- 保存先 ----------
function localStore(){
  const K = "kaikou-v1";
  const read = () => { try { return JSON.parse(localStorage.getItem(K) || "{}"); } catch { return {}; } };
  const write = d => { try { localStorage.setItem(K, JSON.stringify(d)); } catch {} };
  const all = () => { const d = read(); d.works ||= {}; d.versions ||= {}; d.requests ||= {}; d.undo ||= {}; d.meta ||= {}; return d; };
  return {
    label: "この端末だけに保存",
    async listWorks(){ return Object.values(all().works).map(w => ({id:w.id,title:w.title,section:w.section,folder:w.folder||"",updatedAt:w.updatedAt,open:(w.marks||[]).filter(m=>m.status==="open").length})).sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt)); },
    async getWork(id){ return all().works[id] || null; },
    async putWork(w){ const d = all(); d.works[w.id] = w; write(d); },
    async deleteWork(id){ const d = all(); delete d.works[id]; delete d.versions[id]; delete d.requests[id]; delete d.undo[id]; write(d); },
    async addVersion(id, v){ const d = all(); (d.versions[id] ||= []).push(v); write(d); },
    async deleteVersion(id, n){ const d = all(); d.versions[id] = (d.versions[id] || []).filter(v => v.n !== n); write(d); },
    async listVersions(id){ return (all().versions[id] || []).slice().sort((a,b)=>a.n-b.n); },
    async addRequest(id, r){ const d = all(); (d.requests[id] ||= []).push(r); write(d); },
    async listRequests(id){ return (all().requests[id] || []).slice().sort((a,b)=>a.at.localeCompare(b.at)); },
    async putUndo(id, key, u){ const d = all(); (d.undo[id] ||= {})[key] = u; write(d); },
    async getUndo(id, key){ return (all().undo[id] || {})[key] || null; },
    async deleteUndo(id, key){ const d = all(); if (d.undo[id]) delete d.undo[id][key]; write(d); },
    async getMeta(k){ return all().meta[k] || null; },
    async putMeta(k, v){ const d = all(); d.meta[k] = v; write(d); },
  };
}
// claude.ai の保存から読んだ文書は書き換え禁止（凍結）で届くので、必ず写しにしてから使う
function dbStore(db){
  const W = () => db.collection("works");
  const M = () => db.collection("meta");
  const plain = s => s.exists ? clone(s.data()) : null;
  return {
    label: "claude.ai に保存（PC・スマホ共通）",
    async listWorks(){ const s = await W().orderBy("updatedAt","desc").get(); return s.docs.map(d => { const w = d.data(); return {id:d.id,title:w.title,section:w.section,folder:w.folder||"",updatedAt:w.updatedAt,open:(w.marks||[]).filter(m=>m.status==="open").length}; }); },
    async getWork(id){ return plain(await W().doc(id).get()); },
    async putWork(w){ await W().doc(w.id).set(w); },
    async deleteWork(id){
      for (const sub of ["versions","requests","undo"]) { const s = await W().doc(id).collection(sub).get(); for (const d of s.docs) await W().doc(id).collection(sub).doc(d.id).delete(); }
      await W().doc(id).delete();
    },
    async addVersion(id, v){ await W().doc(id).collection("versions").doc("v" + v.n).set(v); },
    async deleteVersion(id, n){ await W().doc(id).collection("versions").doc("v" + n).delete(); },
    async listVersions(id){ const s = await W().doc(id).collection("versions").get(); return s.docs.map(d => clone(d.data())).sort((a,b)=>a.n-b.n); },
    async addRequest(id, r){ await W().doc(id).collection("requests").doc(r.id).set(r); },
    async listRequests(id){ const s = await W().doc(id).collection("requests").get(); return s.docs.map(d => clone(d.data())).sort((a,b)=>a.at.localeCompare(b.at)); },
    async putUndo(id, key, u){ await W().doc(id).collection("undo").doc(key).set(u); },
    async getUndo(id, key){ return plain(await W().doc(id).collection("undo").doc(key).get()); },
    async deleteUndo(id, key){ await W().doc(id).collection("undo").doc(key).delete(); },
    async getMeta(k){ return plain(await M().doc(k).get()); },
    async putMeta(k, v){ await M().doc(k).set(v); },
  };
}

let saving = false, dirty = false, saveTimer = null;
function scheduleSave(){
  if (!cur || cur.sample) { renderBadge(); return; }
  cur.updatedAt = nowIso(); dirty = true; setStatus("保存待ち…");
  clearTimeout(saveTimer); saveTimer = setTimeout(flush, 700);
  const w = works.find(x => x.id === cur.id); if (w) { w.updatedAt = cur.updatedAt; w.open = cur.marks.filter(m => m.status === "open").length; }
  renderBadge();
}
async function flush(){
  if (saving || !dirty || !cur || cur.sample) return;
  const body = clone(cur), size = docBytes(body);
  if (size > DOC_LIMIT - 4096) { dirty = false; setStatus(`保存できませんでした: この作業の記録が大きすぎます（${kb(size)}、上限256KB）。済んだ印を消すか、本文を節に分けて別の作業にしてください`); return; }
  saving = true; dirty = false;
  try {
    // 返事が来ないまま止まらないように、20秒で区切って次の保存へ回す
    await Promise.race([store.putWork(body), new Promise((_, no) => setTimeout(() => no({code:"unavailable"}), 20000))]);
    setStatus(`保存しました（${store.label}）${size > DOC_WARN ? `｜記録が大きくなっています（${kb(size)}／上限256KB）` : ""}`);
  }
  catch (e) {
    if (e && e.code === "unavailable") { dirty = true; setTimeout(flush, 1500 + Math.random()*1000); }
    else setStatus(`保存できませんでした: ${errText(e)}`);
  }
  saving = false;
  if (dirty) flush();
}

// ---------- 作業の記録（やる気の数字） ----------
let actTimer = null;
function bump(kind, n = 1){
  if (cur && cur.sample) return;
  const k = dayKey(); const d = activity.days[k] ||= {done:0, edits:0, marks:0};
  d[kind] = (d[kind] || 0) + n;
  renderToday();
  clearTimeout(actTimer); actTimer = setTimeout(() => store.putMeta("activity", activity).catch(() => {}), 900);
}
function dayTotal(d){ return d ? (d.done||0) + (d.edits||0) + (d.marks||0) : 0; }
function streak(){
  let n = 0; const t = new Date();
  if (!dayTotal(activity.days[dayKey(t)])) t.setDate(t.getDate() - 1);
  while (dayTotal(activity.days[dayKey(t)])) { n++; t.setDate(t.getDate() - 1); }
  return n;
}
function renderToday(){
  const el = $("#today"), d = activity.days[dayKey()];
  if (!dayTotal(d)) { const s = streak(); el.hidden = !s; el.textContent = s ? `${s}日続けて` : ""; return; }
  const s = streak();
  el.hidden = false;
  const parts = [["印", d.marks], ["済み", d.done], ["書き換え", d.edits]].filter(x => x[1]).map(x => x[0] + x[1]);
  el.textContent = `今日 ${parts.join("・")}${s >= 2 ? `｜${s}日続けて` : ""}`;
}

// ---------- 差分 ----------
function lcsOps(a, b, eq = (x,y) => x === y){
  const n = a.length, m = b.length;
  if (n * m > 4e6) return [...a.map((x,i)=>({t:"del",ai:i})), ...b.map((y,j)=>({t:"ins",bj:j}))];
  const w = m + 1, L = new Int32Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    L[i*w+j] = eq(a[i], b[j]) ? L[(i+1)*w+j+1] + 1 : Math.max(L[(i+1)*w+j], L[i*w+j+1]);
  const ops = []; let i = 0, j = 0;
  while (i < n && j < m) {
    if (eq(a[i], b[j])) { ops.push({t:"eq", ai:i, bj:j}); i++; j++; }
    else if (L[(i+1)*w+j] >= L[i*w+j+1]) { ops.push({t:"del", ai:i}); i++; }
    else { ops.push({t:"ins", bj:j}); j++; }
  }
  while (i < n) ops.push({t:"del", ai:i++});
  while (j < m) ops.push({t:"ins", bj:j++});
  return ops;
}
// 行の並び（左＝比べる相手、右＝作業中）
function alignRows(A, B){
  const ops = lcsOps(A, B), rows = [];
  for (let k = 0; k < ops.length;) {
    if (ops[k].t === "eq") { rows.push({o:ops[k].ai, c:ops[k].bj, t:"eq"}); k++; continue; }
    const dels = [], inss = [];
    while (k < ops.length && ops[k].t !== "eq") { if (ops[k].t === "del") dels.push(ops[k].ai); else inss.push(ops[k].bj); k++; }
    const p = Math.max(dels.length, inss.length);
    for (let q = 0; q < p; q++) {
      const o = q < dels.length ? dels[q] : null, c = q < inss.length ? inss[q] : null;
      rows.push({o, c, t: o != null && c != null ? "chg" : (o != null ? "del" : "ins")});
    }
  }
  return rows;
}
function charOps(a, b){ return a.length * b.length > 250000 ? null : lcsOps([...a], [...b]); }
function charFlags(a, b){
  const fa = new Array(a.length).fill(false), fb = new Array(b.length).fill(false);
  const ops = charOps(a, b);
  if (!ops) { fa.fill(true); fb.fill(true); return {fa, fb}; }
  for (const op of ops) { if (op.t === "del") fa[op.ai] = true; else if (op.t === "ins") fb[op.bj] = true; }
  return {fa, fb};
}
// 作業中の行に差し込む「消えた字」: 位置 -> 消えた字
function deletedRuns(a, b){
  const ops = charOps(a, b), map = new Map();
  if (!ops) return map;
  let j = 0;
  for (const op of ops) {
    if (op.t === "del") map.set(j, (map.get(j) || "") + a[op.ai]);
    else j++;
  }
  return map;
}

// ---------- 行と印の位置 ----------
const linesOf = t => t.replace(/\r\n?/g, "\n").split("\n");
function lineNumbers(lines){ const map = []; let n = 0; for (const l of lines) map.push(l.trim() ? ++n : null); return map; }
function curLines(){ return linesOf(cur.current); }
// 印の今の位置。版を入れるたびに行の対応で運んだ位置（at）を使う。at のない古い印だけ文字で近くを探す
function locate(m, lines){
  if (m.at && m.at.v === cur.currentVersion) {
    if (m.at.i < 0 || m.at.i >= lines.length) return null;
    return {i:m.at.i, n:Math.max(1, Math.min(m.at.n, lines.length - m.at.i)), start:m.at.start, end:m.at.end};
  }
  return legacyLocate(m, lines);
}
function legacyLocate(m, lines){
  const lo = Math.max(0, m.line - 10), hi = Math.min(lines.length - 1, m.line + 10);
  let best = -1, bd = Infinity;
  for (let i = lo; i <= hi; i++) if (lines[i] === m.lineTexts[0]) { const d = Math.abs(i - m.line); if (d < bd) { bd = d; best = i; } }
  if (best < 0 && m.quote && m.quote.length >= 2) for (let i = lo; i <= hi; i++) if (lines[i].includes(m.quote)) { const d = Math.abs(i - m.line); if (d < bd) { bd = d; best = i; } }
  if (best < 0) return null;
  let start = m.start, end = m.end;
  if (m.start != null) {
    const r = findRange(lines[best], m, m.start);
    if (!r) return null;
    start = r.start; end = r.end;
  }
  return {i: best, n: m.lineTexts.length, start, end};
}
// 行の中で印の範囲を探し直す（語があれば語で、文中に入れる印は前後の字で）
function findRange(L, m, near){
  if (m.quote) {
    let p = -1, pd = Infinity, from = 0;
    while ((from = L.indexOf(m.quote, from)) >= 0) { const d = Math.abs(from - near); if (d < pd) { pd = d; p = from; } from++; }
    return p < 0 ? null : {start:p, end:p + m.quote.length};
  }

  if (outScope === "all") return `本文をすべて付けます。いま付く本文は約${r.bodyChars}字です。`;
  return `依頼のある行と、その前後の本文を付けます（前と後ろに半分ずつ、行の切れ目で区切ります）。いま付く本文は約${r.bodyChars}字です。`;
}
function markHint(r){

  return "未対応の印をすべて依頼に入れます。";
}
// L□～L□ の欄（key: rq＝本文、mk＝印）
function rangeInputs(key, rg, maxN){
  return `<div class="row2" style="font-size:13px"><label for="${key}A">L</label><input type="number" inputmode="numeric" id="${key}A" class="rqn" min="1" max="${maxN}" value="${rg.a}"><span>～</span><label for="${key}B">L</label><input type="number" inputmode="numeric" id="${key}B" class="rqn" min="1" max="${maxN}" value="${rg.b}"><span class="hint">本文は L1～L${maxN}</span></div>`;
}
// 範囲の欄: 入れるたびに依頼の文を作り直し（欄の中身は書き換えず、入力の途中で邪魔をしない）、
// 入れ終えたら（欄から離れたら）本文の外の番号を最初・最後の行に直して欄にも出す
function bindRange(key, field, rKey){
  const ea = $("#" + key + "A"), eb = $("#" + key + "B"); if (!ea) return;
  let t = null;
  const show = rr => { $("#outPre").textContent = rr.text; $("#rqHint").textContent = scopeHint(rr); $("#mkHint").textContent = markHint(rr); };
  const live = () => { clearTimeout(t); t = setTimeout(() => { if (!ea.value || !eb.value) return; cur[field] = {a: +ea.value, b: +eb.value}; scheduleSave(); show(buildRequest()); }, 300); };
  const fix = () => {
    if (!ea.value || !eb.value) return;
    clearTimeout(t); cur[field] = {a: +ea.value, b: +eb.value};
    const rr = buildRequest(); cur[field] = rr[rKey]; scheduleSave();
    ea.value = rr[rKey].a; eb.value = rr[rKey].b; show(rr);

}
function copyText(text, fallbackEl){
  const done = () => toast("コピーしました");
  const fail = () => { if (fallbackEl) { const r = document.createRange(); r.selectNodeContents(fallbackEl); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } toast("自動でコピーできませんでした。選んだ範囲をコピーしてください"); };
  try { navigator.clipboard.writeText(text).then(done, fail); } catch { fail(); }
}

// ---------- 版 ----------
async function getVersions(){
  if (!cur) return [];
  if (versionsCache) return versionsCache;
  try { versionsCache = await store.listVersions(cur.id); } catch { versionsCache = []; }
  return versionsCache;
}
// 本文を書き換える（版は作らない。印は行の対応で運び、取り消し用に直前の本文と印の状態を残す）
// currentVersion は本文を書き換えた回数（印の位置の照合に使う内部の番号）で、保存した版の番号とは別
// 取り消し用の本文と印は作業の記録とは別の文書（works/<id>/undo/<key>）に置き、作業の記録には目次 {v, from, note, key} だけを残す。
// 作業の記録に入れていた v6 までは、1件256KBの上限を超えて保存できなくなった（10/17）
const UNDO_MAX = 5;
const undoCache = new Map();   // key -> {prevText, marks}（この画面で作った分と読んだ分）
function putUndoDoc(id, key, body, retry = 1){
  return store.putUndo(id, key, body).catch(e => {
    if (retry && e && e.code === "unavailable") return new Promise(r => setTimeout(r, 1500 + Math.random()*1000)).then(() => putUndoDoc(id, key, body, 0));
    throw e;
  });
}
function dropUndoDocs(id, list){ for (const d of list) { if (!d.key) continue; undoCache.delete(d.key); if (!(cur && cur.sample)) store.deleteUndo(id, d.key).catch(() => {}); } }
async function setBody(text, note, source){
  const n = cur.currentVersion + 1;
  const key = uid("u"), body = {prevText:cur.current, marks: clone(cur.marks)};
  carryMarks(curLines(), linesOf(text), n);
  cur.current = text; cur.currentVersion = n;
  if (source !== "undo") {
    undoCache.set(key, body);
    const all = [...(cur.undo || []), {v:n, from:n - 1, note: note || "", key}];
    cur.undo = all.slice(-UNDO_MAX);
    dropUndoDocs(cur.id, all.slice(0, -UNDO_MAX));
    if (!cur.sample) putUndoDoc(cur.id, key, body).catch(() => {});   // 保存できなくても、この画面を開いている間は取り消せる
  }
  scheduleSave(); renderFab();
}
// v6 までの作業は、取り消し用の本文と印を作業の記録の中に持っている。別の文書へ移して、作業の記録を軽くする
async function moveOldUndo(){
  const w = cur;
  if (!w || !Array.isArray(w.undo)) return;
  const old = w.undo.filter(u => !u.key);
  if (!old.length) return;
  w.undo = w.undo.map(u => {
    if (u.key) return u;
    const key = uid("u"), body = {prevText: u.prevText ?? null, marks: u.marks || []};
    undoCache.set(key, body);
    if (!w.sample) putUndoDoc(w.id, key, body).catch(() => {});
    return {v:u.v, from:u.from, note:u.note || "", key};
  });
  scheduleSave();
}
// 今の本文を版として保存する（右下のボタン・版タブ）
async function saveVersion(note){
  const vs = await getVersions();
  const last = vs.filter(v => v.n > 0).sort((a, b) => b.at.localeCompare(a.at))[0];
  if (last && last.text === cur.current) { toast("最後に保存した版と同じ本文です"); return false; }
  const n = Math.max(0, ...vs.map(v => v.n)) + 1;
  const v = {n, text:cur.current, at:nowIso(), note: note || "", source:"save", nonspace: nsLen(cur.current)};
  if (!cur.sample) await store.addVersion(cur.id, v);
  vs.push(v); versionsCache = vs;
  cur.lastSavedAt = v.at; scheduleSave();
  return true;
}

function setBase(v){ baseText = v && v.n > 0 ? v.text : null; baseN = v && v.n > 0 ? v.n : null; baseLabel = v && v.n > 0 ? verShort(v) : "原文"; }
// ---------- 書き換えを取り消す ----------
// 直前の書き換えの前の本文に戻し、印の状態（済み・場所）も書き換えの前に戻す。続けて押すと、さらに前へ（最大5回）
function undoTop(){ const u = cur && cur.undo && cur.undo[cur.undo.length - 1]; return u && u.v === cur.currentVersion ? u : null; }
let undoBusy = false;
async function undoLast(){
  if (undoBusy) return;
  undoBusy = true;
  try { await undoLastInner(); } finally { undoBusy = false; }
}
async function undoLastInner(){
  const u = undoTop(); if (!u) return;
  const w = cur;
  let rec = undoCache.get(u.key) || null;
  if (!rec && !w.sample) { try { rec = await store.getUndo(w.id, u.key); } catch { rec = null; } }
  if (cur !== w || undoTop() !== u) return;   // 読んでいる間に作業を替えた・ほかの書き換えをした
  let prevText = rec ? rec.prevText : null;
  if (rec && prevText == null) { const vs = await getVersions(), prev = vs.find(x => x.n === u.from); prevText = prev ? prev.text : null; }   // v3で残した取り消しの記録
  if (prevText == null) {
    cur.undo = cur.undo.slice(0, -1); scheduleSave(); renderFab();
    toast("前の本文が見つからないので取り消せません"); return;
  }
  const before = new Map((rec.marks || []).map(m => [m.id, m]));
  await setBody(prevText, "書き換えを取り消した", "undo");
  const n = cur.currentVersion;
  cur.marks = cur.marks.map(m => {
    const b = before.get(m.id); if (!b) return m;
    const r = clone(b);
    for (const k of ["comment", "concerns", "directions", "adds", "type"]) r[k] = m[k];   // 後から直した分類やコメントは残す
    r.at = b.at && b.at.v === u.from ? Object.assign({}, b.at, {v:n}) : m.at;
    return r;
  });
  cur.undo = cur.undo.slice(0, -1);
  dropUndoDocs(cur.id, [u]);
  const t = cur.undo[cur.undo.length - 1]; if (t && t.v === u.from) t.v = n;
  scheduleSave(); renderView(); toast("書き換えを取り消しました");
}

const peekEl = () => document.querySelector(".peek");
function closePeek(){ const p = peekEl(); if (p) p.remove(); }
function showPeek(el, tap){
  const mk = cur.marks.find(x => x.id === el.dataset.m) || (focus && focus.pending && focus.pending.id === el.dataset.m ? focus.pending : null);
  if (!mk) return;
  closePeek();
  const tags = (mk.kind === "fix" ? [mk.type, ...mk.concerns, ...mk.directions] : [markLabel(mk), ...mk.adds]).filter(Boolean);
  const p = document.createElement("div");
  p.className = "peek" + (tap ? "" : " hoveronly"); p.dataset.m = mk.id; p.setAttribute("role", "tooltip");
  p.innerHTML = `<div class="tags">${tags.map(t => `<span>${esc(t)}</span>`).join("")}</div>${mk.comment ? `<div class="pk-c">${esc(mk.comment)}</div>` : `<div class="hint">コメントはありません</div>`}${tap ? `<div class="pk-b"><button class="btn small ghost" data-pk="close">閉じる</button><button class="btn small primary" data-pk="open">開く</button></div>` : ""}`;
  document.body.appendChild(p);
  const r = el.getBoundingClientRect(), w = p.offsetWidth, h = p.offsetHeight;
  const left = Math.max(12, Math.min(r.left, window.innerWidth - w - 12));
  const below = r.bottom + 8 + h < window.innerHeight - 60;
  p.style.left = left + "px"; p.style.top = (below ? r.bottom + 6 : Math.max(8, r.top - h - 6)) + "px";
  if (tap) {
    p.querySelector('[data-pk="close"]').onclick = closePeek;
    p.querySelector('[data-pk="open"]').onclick = () => { closePeek(); openMarkEditor(cur.marks.find(x => x.id === mk.id)); };
  }
}

// 最近出した文は、しばらく出さない（端末ごと）
function pickLine(pool, vars = {}){
  const list = (pool || []).filter(t => !/\{q\}/.test(t) || vars.q);
  if (!list.length) return "";
  const recent = ls.get("kaikou.praiseRecent", []);
  const fresh = list.filter(t => !recent.includes(t));
  const t = (fresh.length ? fresh : list)[Math.floor(Math.random() * (fresh.length ? fresh.length : list.length))];
  ls.set("kaikou.praiseRecent", [...recent.filter(x => x !== t), t].slice(-40));
  return t.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? "");
}
// 直した後の文から、引用に使う短い一部（12字まで）
const shortQ = s => { const t = qt(s).replace(/^[「『]|[」』。、]$/g, ""); return t.length > 12 ? t.slice(0, 12) + "…" : t; };
// 主な文のあとに添える一文（今日の数・続けた日数・時間帯）
function extraLine(){
  const d = activity.days[dayKey()] || {}, n = dayTotal(d), s = streak(), h = new Date().getHours();
  if (n === 1) {
    if (s >= 30) return pickLine(PRAISE.streakMonth, {s});
    if (s >= 14 && s < 15) return pickLine(PRAISE.streakTwoWeeks);
    if (s === 7) return pickLine(PRAISE.streakWeek);
    if (s >= 5) return pickLine(PRAISE.streakLong, {s});
    if (s >= 2) return pickLine(PRAISE.streak, {s});
    return pickLine(PRAISE.first);
  }
  if ([5, 10, 15].includes(n)) return pickLine(PRAISE.count, {n});
  if (n >= 20 && n % 10 === 0) return pickLine(PRAISE.countMany, {n});
  if (Math.random() < 0.3) {
    if (h >= 23 || h < 4) return pickLine(PRAISE.late);
    if (h >= 5 && h < 9) return pickLine(PRAISE.morning);
  }
  return "";
}
let praiseTimer = null;
function showPraise(text, label = "ひとこと"){
  const el = $("#praise");
  el.innerHTML = `<div class="praise" role="status"><div class="pt"><span class="pl">${esc(label)}</span><span id="praiseText">${esc(text)}</span></div><button class="btn ghost small" id="praiseClose" aria-label="閉じる">閉じる</button></div>`;
  $("#praiseClose").onclick = () => { el.innerHTML = ""; };
  placePraise();
  clearTimeout(praiseTimer);
  praiseTimer = setTimeout(() => { el.innerHTML = ""; }, 15000);
}
function placePraise(){ const p = document.querySelector(".praise"); if (p) p.classList.toggle("up", !!$("#bar").innerHTML); }
function sayPraise(main, kind, label){
  if (!praiseOn && kind !== "today") return;
  const text = [main, kind === "today" ? "" : extraLine()].filter(Boolean).join("");
  if (!text) return;
  showPraise(text, label);
  if (!(cur && cur.sample)) { (activity.praises ||= []).push({at:nowIso(), text, workId:cur ? cur.id : null}); activity.praises = activity.praises.slice(-30); store.putMeta("activity", activity).catch(() => {}); }
}
function praiseForMarks(ms){
  const allDone = cur.marks.length > 0 && cur.marks.every(m => m.status === "done");
  if (allDone) return sayPraise(pickLine(PRAISE.allDone), "done", "すべて済みました");
  if (ms.length > 1) return sayPraise(pickLine(PRAISE.multi, {k: ms.length}), "done", "ひとこと");
  const m = ms[0], q = shortQ(m.kind === "blank" && m.afterFill ? m.afterFill : m.after);
  if (m.afterSameAsBefore) return sayPraise(pickLine(PRAISE.same), "done", "ひとこと");
  let pool;
  if (m.kind === "fix") {
    if (m.type === "一文にまとめる") pool = PRAISE.merge;
    else if (m.type === "相談") pool = PRAISE.consult;
    else pool = PRAISE.concern[m.concerns[0]];
    if (q && Math.random() < 0.25) pool = PRAISE.fixQ;
  } else {
    pool = PRAISE.add[m.adds[0]] || (m.kind === "insert" ? PRAISE.insert : PRAISE.blank);
    if (m.kind === "blank" && m.afterFill && Math.random() < 0.35) pool = PRAISE.blankQ;
    else if (Math.random() < 0.3) pool = m.kind === "insert" || (m.start != null && m.start === m.end) ? PRAISE.insert : PRAISE.blank;
  }
  if (!pool || Math.random() < 0.15) pool = PRAISE.plain;
  sayPraise(pickLine(pool, {q: m.kind === "blank" && m.afterFill ? shortQ(m.afterFill) : q}), "done", "ひとこと");
}
function praiseForEdit(before, after){
  const A = linesOf(before), B = linesOf(after);
  const rows = alignRows(A, B).filter(r => r.t !== "eq");
  if (!rows.length) return;
  const nonEmpty = L => L.filter(l => l.trim()).length;
  const dl = nonEmpty(B) - nonEmpty(A), d = nsLen(after) - nsLen(before);
  const oldT = rows.map(r => r.o != null ? A[r.o] : "").join(""), newT = rows.map(r => r.c != null ? B[r.c] : "").join("");
  const ops = charOps(oldT, newT), changed = ops ? ops.filter(o => o.t !== "eq").length : Infinity;
  const talk = rows.some(r => r.c != null && /^[\s　]*「/.test(B[r.c]));
  let pool;
  if (dl < 0) pool = PRAISE.edit.merged;
  else if (dl > 0 && Math.abs(d) <= 10) pool = PRAISE.edit.split;
  else if (changed <= 4) pool = PRAISE.edit.small;
  else if (talk && Math.random() < 0.5) pool = PRAISE.edit.talk;
  else if (d <= -5) pool = PRAISE.edit.shorter;
  else if (d >= 5) pool = PRAISE.edit.longer;
  else pool = talk ? PRAISE.edit.talk : PRAISE.edit.plain;
  if (Math.random() < 0.15) pool = PRAISE.edit.plain;
  sayPraise(pickLine(pool, {d: Math.abs(d)}), "edit", "ひとこと");
}
function praiseToday(){
  const d = activity.days[dayKey()] || {}, n = dayTotal(d);
  const sum = [["印", d.marks, "件"], ["済み", d.done, "件"], ["書き換え", d.edits, "回"]].filter(x => x[1]).map(x => x[0] + x[1] + x[2]).join("・");
  const main = pickLine(!n ? PRAISE.todayNone : n < 5 ? PRAISE.todayFew : PRAISE.todayMany, {sum});
  const s = streak();
  sayPraise(main + (n && s >= 2 ? pickLine(s >= 5 ? PRAISE.streakLong : PRAISE.streak, {s}) : ""), "today", "今日のひとこと");
}

function allFolders(){
  const set = new Set(folders);
  for (const w of works) if (w.folder) set.add(w.folder);
  for (const p of [...set]) { const parts = p.split("/"); for (let k = 1; k < parts.length; k++) set.add(parts.slice(0, k).join("/")); }
  return [...set].sort((a, b) => a.localeCompare(b, "ja"));
}
function folderOptions(selected){
  return `<option value="">（フォルダに入れない）</option>` + allFolders().map(p => `<option value="${esc(p)}"${p === selected ? " selected" : ""}>${esc(p.split("/").join(" › "))}</option>`).join("");
}
function renderShelfBtn(){
  const b = $("#shelfBtn");
  if (!cur) { b.innerHTML = works.length ? "作業を選ぶ" : "作業はまだありません"; return; }
  const crumb = cur.folder ? cur.folder.split("/").map(esc).join(" › ") + " › " : "";
  b.innerHTML = `<span class="crumb">${crumb}</span>${esc(cur.title)}${cur.section ? "　" + esc(cur.section) : ""}`;

async function saveFolders(){ if (store) await store.putMeta("folders", {paths: folders, order: workOrder}).catch(() => toast("フォルダを保存できませんでした")); }
// フォルダごとの作業の並び（自分で並べ替えた順。並べていない作業は節の名前の順で後ろへ）
let workOrder = {}, shelfSorting = false;
function sortedWorks(path){
  const ws = works.filter(w => (w.folder || "") === path).sort((a, b) => (a.section || a.title).localeCompare(b.section || b.title, "ja", {numeric:true}));
  const ord = workOrder[path] || [];
  const at = w => { const k = ord.indexOf(w.id); return k < 0 ? Infinity : k; };
  return ws.map((w, k) => ({w, k})).sort((a, b) => (at(a.w) - at(b.w)) || (a.k - b.k)).map(x => x.w);
}
async function moveWork(id, path, d){
  const list = sortedWorks(path).map(w => w.id), k = list.indexOf(id), j = k + d;
  if (k < 0 || j < 0 || j >= list.length) return;
  [list[k], list[j]] = [list[j], list[k]];
  workOrder[path] = list; await saveFolders();
  const sc = document.querySelector(".dialog") ? document.querySelector(".dialog").scrollTop : 0;
  openShelf(); const dl = document.querySelector(".dialog"); if (dl) dl.scrollTop = sc;
}

    <div class="row2"><button class="btn${shelfSorting ? " primary" : ""}" id="shSort">${shelfSorting ? "並び替えを終える" : "並び替え"}</button><button class="btn" id="shAddF">＋フォルダ</button><button class="btn" id="shSample">見本で試す</button><button class="btn" id="shHelp">使い方</button></div>

  d.querySelectorAll("[data-down]").forEach(b => b.onclick = () => moveWork(b.dataset.down, b.dataset.p, 1));
  $("#shSample").onclick = openSample;
  $("#shHelp").onclick = openHelp;

// parent を渡すと新しいフォルダ、path を渡すと名前を変える
function openFolderDialog(parent, path){
  const renaming = path != null;
  const empty = renaming && !works.some(w => (w.folder || "") === path || (w.folder || "").startsWith(path + "/")) && !allFolders().some(p => p.startsWith(path + "/"));
  showModal(`<h2>${renaming ? "フォルダの名前を変える" : "新しいフォルダ"}</h2>
    ${!renaming && parent ? `<p class="hint" style="margin:0">「${esc(parent.split("/").join(" › "))}」の中に作ります。</p>` : ""}
    <label class="fld" for="fName">フォルダの名前<input type="text" id="fName" value="${renaming ? esc(path.split("/").pop()) : ""}" placeholder="例: 3章"></label>
    <div class="dfoot">${renaming && empty ? `<button class="btn danger left" id="fDel">このフォルダを消す</button>` : ""}<button class="btn ghost" id="fCancel">戻る</button><button class="btn primary" id="fOk">${renaming ? "変える" : "作る"}</button></div>`, {lock:true});
  $("#fName").focus();
  $("#fCancel").onclick = openShelf;
  const fd = $("#fDel"); if (fd) fd.onclick = async () => { folders = folders.filter(p => p !== path); await saveFolders(); toast("フォルダを消しました"); openShelf(); };
  $("#fOk").onclick = async () => {
    const name = $("#fName").value.trim().replace(/\//g, "／");
    if (!name) { toast("名前を入れてください"); return; }
    if (!renaming) {
      const p = parent ? parent + "/" + name : name;
      if (allFolders().includes(p)) { toast("同じ名前のフォルダがあります"); return; }
      folders.push(p); await saveFolders(); toast("フォルダを作りました"); openShelf(); return;
    }
    const base = path.split("/").slice(0, -1), np = [...base, name].join("/");
    if (np === path) { openShelf(); return; }
    if (allFolders().includes(np)) { toast("同じ名前のフォルダがあります"); return; }
    const mv = p => p === path ? np : p.startsWith(path + "/") ? np + p.slice(path.length) : p;
    folders = allFolders().map(mv);
    const wo = {}; for (const [k, v] of Object.entries(workOrder)) wo[k ? mv(k) : k] = v; workOrder = wo;
    for (const w of works) if (w.folder && mv(w.folder) !== w.folder) {
      const nf = mv(w.folder); w.folder = nf;
      if (cur && cur.id === w.id) { cur.folder = nf; scheduleSave(); }
      else { try { const full = await store.getWork(w.id); if (full) { full.folder = nf; await store.putWork(full); } } catch {} }
    }
    await saveFolders(); renderShelfBtn(); toast("名前を変えました"); openShelf();
  };
}

    <p class="hint" style="margin:0" id="nwPreview"></p>
    <label class="fld" for="nwText">原文（一文一行のまま貼り付け）<textarea id="nwText" class="body">${esc(dr.text || "")}</textarea></label>
    <p class="hint" style="margin:0">書きかけはこの端末に自動で残ります。ほかのアプリへ移って戻っても続きから書けます。</p>
    <div class="dfoot"><button class="btn ghost" id="nwCancel">閉じる</button><button class="btn primary" id="nwOk">作る</button></div>`, {lock:true});
  const preview = () => { const n = workNames({folder:$("#nwFolder").value, title:$("#nwTitle").value}); $("#nwPreview").textContent = n.work ? `依頼の文では　作品: ${n.work}${n.section ? `　節: ${n.section}` : ""}` : "フォルダを選ぶと、いちばん上のフォルダが依頼の文の作品名になります。"; };
  const keep = () => { ls.set(NEW_DRAFT, {folder:$("#nwFolder").value, title:$("#nwTitle").value, text:$("#nwText").value}); preview(); };
  ["nwFolder","nwTitle","nwText"].forEach(id => { $("#" + id).addEventListener("input", keep); $("#" + id).addEventListener("change", keep); });
  preview();
  $("#nwCancel").onclick = () => {
    const b = $("#nwCancel");
    if ($("#nwText").value.trim() && !b.dataset.armed) { b.dataset.armed = "1"; b.textContent = "貼った本文を捨てて閉じる"; return; }
    ls.del(NEW_DRAFT); closeModal();
  };
  $("#nwOk").onclick = async () => {
    const text = $("#nwText").value.replace(/\r\n?/g, "\n");
    if (!text.trim()) { toast("原文を貼り付けてください"); return; }
    $("#nwOk").disabled = true;
    await storeReady;
    const t = nowIso();
    const w = {id:uid("w"), title:$("#nwTitle").value.trim() || `作業 ${fmtTime(t)}`, section:"", folder:$("#nwFolder").value, original:text, current:text, currentVersion:0, marks:[], globalComment:"", createdAt:t, updatedAt:t};
    // 作業の記録には原文と今の本文の二つが入るので、印を付ける余地を残して長すぎる本文は断る
    if (docBytes(w) > 160 * 1024) { $("#nwOk").disabled = false; toast(`本文が長すぎて保存できません（${nsLen(text)}字）。2万字ほどまでの節に分けて、別々の作業にしてください`); return; }
    try {
      await store.putWork(w); await store.addVersion(w.id, {n:0, text, at:t, note:"原文", source:"original", nonspace:nsLen(text)});
      ls.del(NEW_DRAFT);
      works.unshift({id:w.id, title:w.title, section:w.section, folder:w.folder, updatedAt:t, open:0});
      cur = w; editing = null; versionsCache = [{n:0, text, at:t, note:"原文", source:"original", nonspace:nsLen(text)}]; requestsCache = []; baseText = null; baseLabel = "原文"; baseN = null;
      closeModal(); view = "text"; renderAll(); toast("作りました"); setStatus(`保存しました（${store.label}）`);
    } catch (e) { const b = $("#nwOk"); if (b) b.disabled = false; toast("作れませんでした: " + errText(e)); }
  };
}
async function openWork(id){
  await storeReady;
  await flush();
  setStatus("読み込み中…");
  try { cur = await store.getWork(id); } catch { cur = null; }
  undoCache.clear();
  if (cur) { cur.marks ||= []; upgradeMarks(); ls.set("kaikou.lastWork", id); moveOldUndo(); }
  editing = null; versionsCache = null; requestsCache = null; baseText = null; baseLabel = "原文"; baseN = null; sel.lines.clear(); sel.range = null;
  setStatus(cur ? store.label : "読み込めませんでした");
  renderAll();
}
$("#shelfBtn").onclick = openShelf;
$("#newWorkBtn").onclick = () => openNewWork();
document.querySelectorAll(".tab").forEach(t => t.onclick = () => { view = t.dataset.view; renderAll(); });

function renderBadge(){ $("#openCount").textContent = cur ? cur.marks.filter(m => m.status === "open").length : 0; }
function renderView(){
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.view === view)));
  renderBadge();
  closePeek();
  if (view === "text") renderText(); else if (view === "request") renderRequest(); else if (view === "versions") renderVersions(); else if (view === "settings") renderSettings(); else renderLog();
  renderBar(); renderFab();
}
function renderAll(){ renderShelfBtn(); renderView(); renderToday(); }

window.addEventListener("pagehide", () => { flush(); });
// 裏で起きた誤りを画面の右上に出す（黙って止まらないように）
const showErr = msg => setStatus(`うまく動かなかった操作があります（${String(msg).slice(0, 80)}）。もう一度試すか、ページを読み直してください`);
window.addEventListener("error", e => showErr(e.message || e.error));
window.addEventListener("unhandledrejection", e => showErr((e.reason && (e.reason.message || e.reason.code)) || e.reason));

// ---------- 起動 ----------
// 保存先が決まるまでは、作業を作る・開く操作を待たせる（端末だけの保存に入ってしまわないように）
let storeReadyDone; const storeReady = new Promise(r => storeReadyDone = r);
async function boot(){
  await ghWaitUnlock();
  store = ghStore();
  renderAll();
  works = await store.listWorks();
  try { const f = await store.getMeta("folders"); folders = f && Array.isArray(f.paths) ? f.paths.slice() : []; workOrder = f && f.order ? clone(f.order) : {}; } catch { folders = []; }
  try { const a = await store.getMeta("activity"); if (a) activity = {days:a.days || {}, praises:a.praises || []}; } catch {}
  storeReadyDone();
  setStatus(store.label);
  const last = ls.get("kaikou.lastWork", null);
  const first = works.find(w => w.id === last) || works[0];
  if (first) await openWork(first.id); else renderAll();
  // 新しい作業の書きかけがあれば、窓を開き直す（ほかのアプリから戻ったときにページが読み直されても続けられるように）
  const dr = ls.get(NEW_DRAFT, null);
  if (dr && dr.text && dr.text.trim() && !$("#modal").innerHTML) openNewWork();
}
boot();
})();
</script>
